# Branded Windows x64 client with your own server baked in.
# Actions tab -> "Build branded Windows client" -> Run workflow -> fill the 3 fields.
# Output: artifact "<app_name>-windows-x64" containing a single portable <app_name>.exe.
# Takes ~1-1.5h on the first run (vcpkg + Rust), faster later thanks to caches.
# Steps are copied from flutter-build.yml (build-for-windows-flutter, x86_64), minus signing,
# MSI, printer driver, virtual display driver and the privacy-mode topmost window.
name: Build branded Windows client

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name: letters and digits only, no spaces (e.g. HQDesk)"
        required: true
      server:
        description: "VPS public IP or domain, no port"
        required: true
      key:
        description: "Content of C:\\RustDeskServer\\id_ed25519.pub on the VPS"
        required: true

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build:
    needs: generate-bridge
    runs-on: windows-2022
    env:
      RUST_VERSION: "1.75"
      LLVM_VERSION: "15.0.6"
      FLUTTER_VERSION: "3.24.5"
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
      BRAND_APP_NAME: ${{ inputs.app_name }}
      BRAND_SERVER: ${{ inputs.server }}
      BRAND_KEY: ${{ inputs.key }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          [[ "$BRAND_APP_NAME" =~ ^[A-Za-z][A-Za-z0-9]{1,30}$ ]] || { echo "::error::app_name: 2-31 letters/digits, starting with a letter"; exit 1; }
          [[ "$BRAND_APP_NAME" != "RustDesk" ]] || { echo "::error::app_name must not be RustDesk"; exit 1; }
          [[ "$BRAND_SERVER" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::server: IP or domain only, no port/scheme"; exit 1; }
          [[ "$BRAND_KEY" =~ ^[A-Za-z0-9+/]{43}=$ ]] || { echo "::error::key: paste id_ed25519.pub exactly (44 chars ending in =)"; exit 1; }

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: brand-windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: Check brand is compiled in
        run: |
          $dll = [Text.Encoding]::GetEncoding(28591).GetString([IO.File]::ReadAllBytes("rustdesk\librustdesk.dll"))
          foreach ($v in $env:BRAND_APP_NAME, $env:BRAND_SERVER, $env:BRAND_KEY) {
            if (-not $dll.Contains($v)) { throw "'$v' not found in librustdesk.dll - brand was not compiled in" }
          }

      - name: Pack single portable exe
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p out
          mv ./target/release/rustdesk-portable-packer.exe "./out/$BRAND_APP_NAME.exe"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BRAND_APP_NAME }}-windows-x64
          path: out/
          if-no-files-found: error
